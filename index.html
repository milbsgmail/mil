<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Бравл-Клаб</title>
    <link rel="stylesheet" href="style.css">
    <!-- Подключаем логику кнопок -->
    <script src="script.js" defer></script>
</head>
<body>

    <h1>Бравл-Клаб</h1>
    <p>Сайт нашего клуба</p>

    <!-- Главное меню -->
    <div class="menu">
        <button id="brawler-btn">Бойцы</button>
        <button id="quiz-btn">Викторина</button>
        <button id="click-btn">Кликер</button>
        <button id="top-btn">Топ игроков</button>
    </div>

    <!-- Раздел Кликера -->
    <div id="click-section" style="margin-top: 20px;">
        <div style="font-size: 24px; color: #ffcc00; font-weight: bold;">
            Золото: <span id="gold-count">0</span>
        </div>
        
        <div style="margin-top: 20px;">
            <button id="click-action-btn" style="background-color: #ff4500; color: white; padding: 15px 30px; cursor: pointer; border: none; border-radius: 8px; font-size: 18px; font-weight: bold;">Клик!</button>
        </div>

        <div style="margin-top: 20px;">
            <button id="upgrade-btn" style="padding: 10px 20px; cursor: pointer; transition: background-color 0.3s;">Купить Шахту (Цена: 15 золота)</button>
            <p style="font-size: 14px; opacity: 0.8;">Сейчас даёт за клик: <span id="click-power">1</span> золота</p>
        </div>
    </div>

    <!-- Раздел Викторины (изначально скрыт) -->
    <div id="quiz-section" style="margin-top: 30px; border-top: 1px solid #ccc; padding-top: 20px; display: none;">
        <h2 id="questionText">Вопросы загружаются...</h2>
        <div id="answersBlock"></div>
    </div>

    <!-- Раздел Бойцов (изначально скрыт) -->
    <div id="brawlers-section" style="margin-top: 30px; border-top: 1px solid #ccc; padding-top: 20px; display: none;">
        <h2>Ваша команда бойцов</h2>
        <p style="font-size: 14px; opacity: 0.8; margin-bottom: 20px;">Прокачивайте бойцов, чтобы увеличивать силу клика!</p>
        <div id="brawlers-list" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px;">
            <!-- Бойцы будут создаваться автоматически через JavaScript -->
        </div>
    </div>

</body>
</html>
