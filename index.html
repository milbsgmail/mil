<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Бравл-Клаб</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <h1>Бравл-Клаб</h1>
    <p>Сайт нашего клуба</p>

    <!-- Главное меню -->
    <div class="menu">
        <button id="click-btn">Кликер</button>
        <button id="brawler-btn">Бойцы</button>
        <button id="quiz-btn">Викторина</button>
        <button id="top-btn">Топ игроков</button>
    </div>

    <!-- Раздел Кликера -->
    <div id="click-section" style="margin-top: 20px;">
        <div style="font-size: 24px; color: #ffcc00; font-weight: bold;">
            Золото: <span id="gold-count">0</span>
        </div>
        <!-- Индикатор пассивного дохода -->
        <div id="cps-display" style="font-size: 16px; color: #4ade80; margin-top: 5px;">
            В секунду: +0 золота
        </div>
        
        <div style="margin-top: 20px;">
            <button id="click-action-btn">Клик!</button>
        </div>

        <div style="margin-top: 20px;">
            <button id="upgrade-btn">Купить Шахту (Цена: 15 золота)</button>
            <p style="font-size: 14px; opacity: 0.8;">Сейчас даёт за клик: <span id="click-power">1</span> золота</p>
        </div>
    </div>

    <!-- Раздел Викторины -->
    <div id="quiz-section" style="margin-top: 30px; border-top: 1px solid #4b5563; padding-top: 20px; display: none;">
        <h2 id="questionText">Вопросы загружаются...</h2>
        <div id="answersBlock"></div>
    </div>

    <!-- Раздел Бойцов -->
    <div id="brawlers-section" style="margin-top: 30px; border-top: 1px solid #4b5563; padding-top: 20px; display: none;">
        <h2>Ваша команда бойцов</h2>
        <p style="font-size: 14px; opacity: 0.8; margin-bottom: 20px;">Прокачивайте бойцов, чтобы увеличивать силу клика и пассивный доход!</p>
        <div id="brawlers-list" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; justify-content: center; padding: 10px;">
            <!-- Бойцы создаются через JS -->
        </div>
    </div>

    <!-- Раздел Топа игроков -->
    <div id="top-section" style="margin-top: 30px; border-top: 1px solid #4b5563; padding-top: 20px; display: none;">
        <h2>Топ игроков клуба</h2>
        <table>
            <thead>
                <tr>
                    <th>Место</th>
                    <th>Игрок</th>
                    <th>Золото</th>
                </tr>
            </thead>
            <tbody>
                <!-- Таблица лидеров заполняется динамически через JS -->
            </tbody>
        </table>
    </div>

</body>
</html>
